# What can this repo's Cloudflare credentials actually DO?
#
# Founder asked: "what do you need from me to set it up yourself via
# GitHub Actions keys?" — the right answer starts with knowing what is
# already here. This workflow inventories it, so the ask that follows is
# the SMALLEST possible one rather than a guess.
#
# It answers three questions with evidence:
#   1. Is ontold.site delegated to Cloudflare yet? (public DNS, no
#      credential needed — tells us whether the nameserver switch at the
#      registrar is still outstanding, which is founder-only work.)
#   2. Do ANY of the repo's secrets work as a Cloudflare API token, and
#      exactly which capabilities does each one have?
#   3. Which specific permission is missing for the site-host deploy.
#
# Safety: this NEVER prints a secret value. Every candidate is masked on
# entry; only lengths, and pass/fail per capability, are reported. That
# is the same rule health.py and provision-r2.yml follow.
#
# Always exits 0 — it is a report, not a gate.
name: cf-credential-audit

on:
  workflow_dispatch: {}
  push:
    # No branch filter. This was pinned to claude/mvp-launch-planning-
    # moh4d5, a branch work left months ago, so editing the audit
    # stopped running the audit — which is the only way anyone reads
    # it. It always exits 0 and prints nothing but pass/fail, so
    # running it wherever it changes costs a runner minute.
    paths: ['.github/workflows/cf-credential-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Is ontold.site delegated to Cloudflare? (no credential needed)
        run: |
          set +e
          echo "=== Public DNS facts (whoever runs the domain, this is true) ==="
          # The domain the custom-domain lane is currently pointed at,
          # read from its request file rather than typed here — the
          # audit should report on whatever we are actually attaching.
          PENDING=$(python3 -c "import json;print(json.load(open('.github/dispatch-requests/attach-domain.json')).get('domain',''))" 2>/dev/null || true)
          for D in ontold.site ontold.com workais.app ${PENDING}; do
            NS=$(dig +short NS "$D" | sort | tr '\n' ' ')
            SOA=$(dig +short SOA "$D" | head -1)
            echo "--- $D"
            echo "    NS : ${NS:-<none — domain not delegated / not registered>}"
            echo "    SOA: ${SOA:-<none>}"
            case "$NS" in
              *ns.cloudflare.com*) echo "    => ON CLOUDFLARE (zone active, nameservers switched)";;
              "")                  echo "    => NOT delegated anywhere yet. If the registrar is not Cloudflare, the nameserver switch is founder-only work.";;
              *)                   echo "    => delegated, but NOT to Cloudflare. Nameservers must be repointed at the registrar (founder-only).";;
            esac
          done
          echo
          echo "=== Wildcard probe (does *.ontold.site resolve?) ==="
          dig +short A probe-test.ontold.site | head -3 || true
          exit 0

      - name: What can the R2 S3 keys actually do? (bucket vs object rights)
        # Founder, 2026-07-25: "but why were we able to create buckets and
        # now no longer?" CreateBucket succeeded at 05:24 and 05:54 and
        # returned AccessDenied at 06:37 — authenticated but not
        # authorised, i.e. the credential's SCOPE changed rather than the
        # credential dying. R2 S3 keys are issued against an R2 API token,
        # so narrowing that token (Admin Read & Write -> Object Read &
        # Write) removes bucket-level operations while leaving object ones
        # intact. Rather than assert that, probe each operation.
        #
        # The object probe writes and then deletes its own scratch key
        # under __audit/, so it never touches published content — the
        # always-testable-without-altering-data rule.
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID     || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          ACCOUNT_RAW:           ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          ACC=$(printf '%s' "${ACCOUNT_RAW:-}" | grep -oiE '[0-9a-f]{32}' | head -1)
          [ -n "$ACC" ] && echo "::add-mask::$ACC"
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "$ACC" ]; then
            echo "(no R2 S3 keys or account id — skipping)"; exit 0
          fi
          EP="https://${ACC}.r2.cloudflarestorage.com"
          KEY="__audit/probe-${GITHUB_RUN_ID}.txt"
          echo "credential lengths: id=${#AWS_ACCESS_KEY_ID} secret=${#AWS_SECRET_ACCESS_KEY} (healthy R2 S3: id=32 secret=64)"
          echo

          try(){ # label, command...
            local label="$1"; shift
            if "$@" >/tmp/out 2>/tmp/err; then echo "  YES  $label"; return 0; fi
            echo "  no   $label  -> $(tr -d '\n' </tmp/err | sed 's/.*(\([A-Za-z]*\)).*/\1/' | cut -c1-80)"
            return 1
          }

          echo "ACCOUNT-LEVEL (these are what a narrowed token loses first)"
          try "ListBuckets"   aws s3api list-buckets --endpoint-url "$EP" --region auto
          try "CreateBucket"  aws s3api create-bucket --bucket "ontold-audit-probe-${GITHUB_RUN_ID}" --endpoint-url "$EP" --region auto
          # If that create DID succeed, do not leave litter behind.
          aws s3api delete-bucket --bucket "ontold-audit-probe-${GITHUB_RUN_ID}" --endpoint-url "$EP" --region auto >/dev/null 2>&1

          echo
          echo "OBJECT-LEVEL on ontold-sites (this is what serving and seeding need)"
          try "HeadBucket"    aws s3api head-bucket --bucket ontold-sites --endpoint-url "$EP" --region auto
          try "ListObjects"   aws s3api list-objects-v2 --bucket ontold-sites --max-items 1 --endpoint-url "$EP" --region auto
          printf 'audit probe, safe to delete\n' > /tmp/probe.txt
          try "PutObject"     aws s3api put-object --bucket ontold-sites --key "$KEY" --body /tmp/probe.txt --endpoint-url "$EP" --region auto
          try "GetObject"     aws s3api get-object --bucket ontold-sites --key "$KEY" /tmp/back.txt --endpoint-url "$EP" --region auto
          try "DeleteObject"  aws s3api delete-object --bucket ontold-sites --key "$KEY" --endpoint-url "$EP" --region auto

          echo
          echo "READ THIS: if the OBJECT-LEVEL rows are YES, media serving and"
          echo "seed-r2 are healthy and the CreateBucket denial is cosmetic for"
          echo "everything we run today. If any object row is 'no', that IS"
          echo "launch-blocking — /api/watch and every seeded asset depend on it."
          exit 0

      - name: What can each candidate secret do as a Cloudflare API token?
        env:
          # Every secret that could plausibly hold a Cloudflare API token.
          # Values are masked below before any use.
          C_CLOUDFLARE_API_TOKEN:          ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C_CLOUDFLARE_R2_ACCESS_KEY_ID:   ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          C_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          C_R2_ACCESS_KEY_ID:              ${{ secrets.R2_ACCESS_KEY_ID }}
          C_R2_SECRET_ACCESS_KEY:          ${{ secrets.R2_SECRET_ACCESS_KEY }}
          C_API_KEY:                       ${{ secrets.API_KEY }}
          ACCOUNT_RAW:                     ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          ACC=$(printf '%s' "${ACCOUNT_RAW:-}" | grep -oiE '[0-9a-f]{32}' | head -1)
          [ -n "$ACC" ] && echo "::add-mask::$ACC"
          echo "account id resolved: $([ -n "$ACC" ] && echo yes || echo NO)"
          echo

          # Capability probe. Prints ONLY pass/fail + Cloudflare's error
          # code — never the token, never the response body wholesale.
          # Verdicts come from a JSON parser, never grep: Cloudflare
          # pretty-prints some success bodies ('"success": true'), which a
          # '"success":true' pattern silently misses and reports as a
          # failure. That false negative cost real time here.
          probe() {
            local label="$1" url="$2" tok="$3"
            local body code
            body=$(curl -sS --max-time 20 "$url" -H "Authorization: Bearer ${tok}" 2>/dev/null)
            if printf '%s' "$body" | python3 -c 'import sys,json; sys.exit(0 if json.load(sys.stdin).get("success") else 1)' 2>/dev/null; then
              echo "      $label: YES"
              return 0
            fi
            code=$(echo "$body" | sed -nE 's/.*"code":([0-9]+).*/\1/p' | head -1)
            echo "      $label: no (cloudflare code ${code:-?})"
            return 1
          }

          for NAME in CLOUDFLARE_API_TOKEN CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY API_KEY; do
            VAR="C_${NAME}"
            RAW="${!VAR:-}"
            TOK=$(printf '%s' "$RAW" | tr -d '[:space:]')
            [ -n "$TOK" ] && echo "::add-mask::$TOK"
            echo "--- secret ${NAME}"
            if [ -z "$TOK" ]; then
              echo "      (not set)"
              continue
            fi
            echo "      length: ${#TOK}"
            probe "usable as an API token at all" "https://api.cloudflare.com/client/v4/user/tokens/verify" "$TOK"
            if [ -n "$ACC" ]; then
              probe "can deploy Workers  (Workers Scripts)" "https://api.cloudflare.com/client/v4/accounts/${ACC}/workers/scripts" "$TOK"
              probe "can manage R2 buckets via API"        "https://api.cloudflare.com/client/v4/accounts/${ACC}/r2/buckets"      "$TOK"
            fi
            probe "can read zones      (Zone:Read)"        "https://api.cloudflare.com/client/v4/zones?name=ontold.site"          "$TOK"
          done

          echo
          echo "Reminder: a 'no' on every line for a secret usually means it is an"
          echo "R2 S3 key (those authenticate to the S3 endpoint, NOT to"
          echo "api.cloudflare.com) — which is normal and not a fault."

          # ── Zone-scoped detail for the live token ────────────────────
          # Run 1 showed CLOUDFLARE_API_TOKEN already has R2 AND Zone:Read
          # (so it is NOT the R2-only token first guessed). Narrow down
          # exactly which remaining permissions are missing, so the fix is
          # "tick these boxes on the existing token" rather than "make a
          # new one" — an edited token keeps its value, so the GitHub
          # secret would not need to change at all.
          echo
          echo "=== Exactly which permissions does CLOUDFLARE_API_TOKEN still need? ==="
          TOK=$(printf '%s' "${C_CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')
          [ -n "$TOK" ] && echo "::add-mask::$TOK"
          if [ -z "$TOK" ]; then echo "(token not set)"; exit 0; fi
          # Which zones can this token SEE? A permitted /zones call that
          # returns an empty result is not the same as "has Zone:Read for
          # ontold.site" — run 1's "can read zones: YES" only meant the
          # endpoint was allowed. Zone names are public DNS facts, not
          # secrets, so listing them here is safe and is the diagnostic.
          ALL=$(curl -sS "https://api.cloudflare.com/client/v4/zones?per_page=50" -H "Authorization: Bearer ${TOK}")
          echo "zones visible to this token: $(printf '%s' "$ALL" | python3 -c 'import sys,json; print(" ".join(z.get("name","") for z in (json.load(sys.stdin).get("result") or [])) or "(none)")' 2>/dev/null || echo '(unreadable response)')"
          echo "ontold.site in that list: $(printf '%s' "$ALL" | python3 -c 'import sys,json; sys.exit(0 if any(z.get("name")=="ontold.site" for z in (json.load(sys.stdin).get("result") or [])) else 1)' 2>/dev/null && echo YES || echo 'NO  <-- token Zone Resources must INCLUDE ontold.site')"

          ZID=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=ontold.site" \
                  -H "Authorization: Bearer ${TOK}" | python3 -c 'import sys,json; rs=json.load(sys.stdin).get("result") or []; print(rs[0]["id"] if rs else "")' 2>/dev/null || echo '')
          if [ -n "$ZID" ]; then
            echo "::add-mask::$ZID"
            probe "Account / Workers Scripts   (needed: deploy the worker)" "https://api.cloudflare.com/client/v4/accounts/${ACC}/workers/scripts" "$TOK"
            probe "Zone    / DNS               (needed: wildcard A record)" "https://api.cloudflare.com/client/v4/zones/${ZID}/dns_records?per_page=1" "$TOK"
            probe "Zone    / Workers Routes    (needed: *.ontold.site route)" "https://api.cloudflare.com/client/v4/zones/${ZID}/workers/routes" "$TOK"
            probe "Account / Workers R2 Storage (already proven working)"   "https://api.cloudflare.com/client/v4/accounts/${ACC}/r2/buckets" "$TOK"
            # The custom-domain lane. attach-domain run 1 got as far as
            # creating the fallback DNS record, then died on 10000
            # Authentication error setting the fallback origin — a
            # permission nobody had checked because nothing probed it.
            # A report that costs nothing beats a lane run that leaves
            # the zone half-configured.
            probe "Zone    / SSL and Certificates (needed: custom hostnames)" "https://api.cloudflare.com/client/v4/zones/${ZID}/custom_hostnames?per_page=1" "$TOK"
            probe "Zone    / SaaS fallback origin  (needed: attach-domain)"   "https://api.cloudflare.com/client/v4/zones/${ZID}/custom_hostnames/fallback_origin" "$TOK"
            # The other way to get there: mint a scoped token per run
            # instead of widening the standing one. Either grant
            # unblocks the lane, and the run cannot tell you which is
            # missing — so name both here.
            probe "Account / API Tokens         (alt: just-in-time SSL token)" "https://api.cloudflare.com/client/v4/user/tokens?per_page=1" "$TOK"
          else
            echo "Cannot resolve the ontold.site zone id, so the per-permission"
            echo "probes below it cannot run. ontold.site IS on Cloudflare (its"
            echo "nameservers say so), so this means the token's Zone Resources"
            echo "do not include it. Fix that first, then re-run for the rest."
            probe "Account / Workers Scripts (account-scoped, testable anyway)" "https://api.cloudflare.com/client/v4/accounts/${ACC}/workers/scripts" "$TOK"
          fi
          exit 0

      - name: Which zone can mail come from
        # Added because mail was written against `mail.ontold.com` on the
        # assumption that the site domain and the mail domain go
        # together. This file already said otherwise, in the MCP Worker's
        # config: the token holds Workers Routes over workais.app,
        # ontold.site and onloved.com and NOT ontold.com.
        #
        # A sending domain has to be a zone on THIS account. If ontold.com
        # is not one, `mail.ontold.com` can never be onboarded here and
        # `hello@ontold.com` cannot be an Email Routing rule — so the
        # right answer is whichever zone is actually present.
        #
        # Reporting only, and `bash {0}`: a zone that is absent is the
        # answer, not a failure.
        shell: bash {0}
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          A=$(printf '%s' "${ACC}" | grep -oiE '[0-9a-f]{32}' | head -1)
          [ -n "$A" ] && echo "::add-mask::$A"
          echo "## Where mail can come from"
          for D in ontold.site ontold.com workais.app; do
            ZID=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=${D}" -H "Authorization: Bearer ${TOK}" \
              | python3 -c 'import sys,json; r=(json.load(sys.stdin).get("result") or [{}]); print(r[0].get("id","") if r else "")' 2>/dev/null)
            if [ -z "$ZID" ]; then
              echo "  ${D}: NOT a zone this token can see — cannot host a sending domain"
              continue
            fi
            R=$(curl -sS "https://api.cloudflare.com/client/v4/zones/${ZID}/email/routing" -H "Authorization: Bearer ${TOK}" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); r=d.get("result") or {}; print(("enabled" if r.get("enabled") else "present, not enabled") if d.get("success") else "unreadable")' 2>/dev/null)
            echo "  ${D}: zone present — Email Routing ${R}"
          done
          echo ""
          echo "A sending subdomain (mail.<zone>) is onboarded per ACCOUNT under"
          echo "Email Service, but the zone has to be here for its DNS to be written."

      - name: Verdict
        run: |
          echo "::notice::Audit complete. Read the 'exactly which permissions' block: every line marked 'no' is a checkbox to tick on the EXISTING Cloudflare token (dash → Manage Account → API Tokens → the token → Edit). Editing a token preserves its value, so no GitHub secret needs to change."
