# Adopt a portfolio of domains into our Cloudflare account — the bulk
# lane for the founder's 50-domain move off Squarespace.
#
# For every domain listed in internal/adopt-domains.json this run:
#   1. creates a FREE-plan zone (jump_start imports the domain's
#      existing DNS records, so a site still hosted elsewhere keeps
#      working — moving nameservers moves serving, not the website);
#   2. prints the nameserver pair to paste into Squarespace — the one
#      per-domain step only the registrar's owner can do;
#   3. is idempotent: an already-adopted domain just reprints its
#      nameservers and status.
#
# It deliberately does NOT wire any domain to a site — that is
# attach-domain's job, one request per site, once a zone is Active.
# Zone creation needs Account -> Zone -> Edit on the API token; a
# missing grant fails with that exact ask.
name: adopt-domains

on:
  push:
    paths:
      - 'internal/adopt-domains.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_RAW: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Create zones, print nameservers
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          TOK=$(printf '%s' "${CF_TOKEN:-}" | tr -d '[:space:]')
          ACC=$(printf '%s' "${ACCOUNT_RAW:-}" | grep -oiE '[0-9a-f]{32}' | head -1)
          [ -n "$TOK" ] && echo "::add-mask::$TOK"
          [ -n "$ACC" ] && echo "::add-mask::$ACC"
          [ -z "$TOK" ] && { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          [ -z "$ACC" ] && { echo "::error::no Cloudflare account id in secrets"; exit 1; }

          # Just-in-time credential: zone creation is minted for 20
          # minutes and burned on exit (founder: "surely i just need to
          # create account api tokens and you can create the rest?").
          # If minting is refused, the base token is tried as-is.
          ZTOK="$TOK"; JID=''
          J=$(CLOUDFLARE_API_TOKEN="$TOK" CF_ACCOUNT_ID="$ACC" node scripts/mint_scoped_cf_token.mjs mint jit-adopt-domains 20 'Zone Write' 2>/dev/null || true)
          if [ -n "$J" ]; then
            ZTOK=$(printf '%s' "$J" | jq -r .value); JID=$(printf '%s' "$J" | jq -r .id)
            echo "::add-mask::$ZTOK"; echo "::add-mask::$JID"
            echo "[cf-token] minted a 20-minute Zone Write token for this run"
          else
            echo "[cf-token] could not mint a scoped token - trying the base token (add Account -> Account API Tokens -> Edit to enable just-in-time credentials)"
          fi
          burnjit() { [ -n "$JID" ] && CLOUDFLARE_API_TOKEN="$TOK" CF_ACCOUNT_ID="$ACC" node scripts/mint_scoped_cf_token.mjs burn "$JID" || true; }
          trap burnjit EXIT

          ok() { python3 -c 'import sys,json; d=json.load(sys.stdin); print("1" if d.get("success") else "")'; }
          err() { python3 -c 'import sys,json; es=(json.load(sys.stdin).get("errors") or [{}]); print(str(es[0].get("code"))+": "+str(es[0].get("message")))'; }
          ns_of() { python3 -c 'import sys,json; r=json.load(sys.stdin).get("result"); r=(r[0] if isinstance(r,list) and r else r) or {}; print(str(r.get("status") or "?")+"|"+" ".join(r.get("name_servers") or []))'; }

          COUNT=$(jq -r '.domains | length' internal/adopt-domains.json)
          [ "$COUNT" = 0 ] && { echo "nothing to adopt - the list in internal/adopt-domains.json is empty"; exit 0; }
          echo "adopting ${COUNT} domain(s)"

          FAILED=0
          echo '## Nameservers to set at Squarespace' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| domain | status | set these nameservers |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for D in $(jq -r '.domains[]' internal/adopt-domains.json | tr 'A-Z' 'a-z' | sort -u); do
            printf '%s' "$D" | grep -qE '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$' \
              || { echo "::warning::'$D' is not a domain - skipped"; FAILED=$((FAILED+1)); continue; }
            EX=$(curl -sS --max-time 20 "$API/zones?name=$D" -H "Authorization: Bearer $TOK")
            HAVE=$(printf '%s' "$EX" | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("result") or []))')
            if [ "$HAVE" != 0 ]; then
              INFO=$(printf '%s' "$EX" | ns_of)
              echo "[zone] $D already ours (${INFO%%|*}) - nameservers: ${INFO#*|}"
              echo "| $D | already ours (${INFO%%|*}) | ${INFO#*|} |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            R=$(curl -sS --max-time 30 -X POST "$API/zones" \
              -H "Authorization: Bearer $ZTOK" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$D\",\"account\":{\"id\":\"$ACC\"},\"jump_start\":true,\"type\":\"full\"}")
            if [ -n "$(printf '%s' "$R" | ok)" ]; then
              INFO=$(printf '%s' "$R" | ns_of)
              echo "[zone] created $D - nameservers: ${INFO#*|}"
              echo "| $D | created | ${INFO#*|} |" >> "$GITHUB_STEP_SUMMARY"
            else
              E=$(printf '%s' "$R" | err)
              echo "::warning::could not create $D ($E)"
              echo "| $D | FAILED: $E | - |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=$((FAILED+1))
              case "$E" in *[Aa]uth*) echo "::error::zone creation refused - the ONE grant that unlocks everything: add Account -> Account API Tokens -> Edit to the existing token (just-in-time minting covers the rest), then re-run"; exit 1;; esac
            fi
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'After changing nameservers, each zone flips to Active within minutes-hours. Check MX records per domain if it carries email. Registrar transfers (the billing move) come later, per domain, once unlocked at Squarespace.' >> "$GITHUB_STEP_SUMMARY"
          [ "$FAILED" = 0 ] || echo "::warning::${FAILED} domain(s) skipped or failed - see above"
          echo "::notice::zones ready - the per-domain nameserver table is in this run's Summary tab"
